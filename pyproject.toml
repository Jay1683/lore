[project]
name = "lore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "chromadb>=1.5.9",
  "ipykernel>=7.3.0",
  "langchain>=1.3.14",
  "langchain-groq>=1.1.3",
  "langgraph>=1.2.10",
  "openpyxl>=3.1.5",
  "pymupdf>=1.28.0",
  "python-docx>=1.2.0",
  "python-dotenv>=1.2.2",
  "sentence-transformers>=5.6.1",
  "streamlit>=1.60.0",
  "tiktoken>=0.13.0",
  "torchvision>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
